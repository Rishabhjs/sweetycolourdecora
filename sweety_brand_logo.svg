<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap');
      .title-sc {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 600;
        font-size: 44px;
        fill: #FFFFFF;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .title-decora {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 56px;
        fill: #FFFFFF;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .mark-r {
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        font-size: 18px;
        fill: #FFFFFF;
      }
      .tagline-sub {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #D4D4D4;
        letter-spacing: 0.38em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect width="900" height="300" rx="36" fill="#0D0D0D"/>

  <!-- Left Architectural Squircle Emblem -->
  <g transform="translate(50, 50)">
    <!-- Gold Border Rounded Square -->
    <rect x="0" y="0" width="200" height="200" rx="42" fill="none" stroke="#C5A059" stroke-width="4.5"/>
    
    <!-- White Minimalist House Outline -->
    <!-- Roof peak at (100, 36), left eave at (32, 98), right eave at (168, 98) -->
    <!-- Left wall from (52, 80) down to (52, 162), Right wall from (148, 80) down to (148, 162) -->
    <path d="M 32 98 L 100 36 L 168 98" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 54 85 L 54 162 M 146 85 L 146 162" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Gold Paint Roller / Architectural Trowel Motif -->
    <!-- Main Roller Block -->
    <rect x="68" y="105" width="64" height="36" rx="8" fill="#C5A059"/>
    <!-- Roller Handle -->
    <path d="M 100 141 L 100 165" fill="none" stroke="#C5A059" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Right Typography Wordmark -->
  <g transform="translate(295, 0)">
    <!-- Line 1: SWEETY COLOUR -->
    <text x="0" y="112" class="title-sc">SWEETY COLOUR</text>

    <!-- Line 2: DECORA + (R) -->
    <text x="0" y="180" class="title-decora">DECORA</text>
    <text x="272" y="146" class="mark-r">&#174;</text>

    <!-- Gold Accent Underline -->
    <line x1="2" y1="202" x2="68" y2="202" stroke="#C5A059" stroke-width="3" stroke-linecap="round"/>

    <!-- Line 3: BUILDING LANDMARKS SINCE 2003 -->
    <text x="0" y="244" class="tagline-sub">BUILDING LANDMARKS SINCE 2003</text>
  </g>
</svg>
